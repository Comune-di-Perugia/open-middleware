description:
  it:
    localisedName: Open Middleware
    shortDescription: >
      Servizi per acquisire, archiviare e classificare dati e documenti.
    longDescription: >
      Open Middleware raccoglie dati e documenti da più applicazioni.
      I servizi conservano i documenti e le relative classificazioni.
      Le applicazioni possono consultare i documenti e ricevere notifiche dopo
      il salvataggio, per esempio per aggiungere tag al documento.
      Il progetto include un chart Helm per la distribuzione su Kubernetes.
    features:
      - Acquisizione di dati e documenti
      - Archiviazione e ricerca per classificazione
      - Notifiche dopo il salvataggio
    documentation: "https://github.com/Comune-di-Perugia/open-middleware/blob/main/docs/architettura.md"

