{{- $ing := .Values.ingress }}
{{- $gateway := .Values.gateway }}
{{- if $gateway.enabled }}
{{- if not (and $ing.enabled .Values.workloads.keycloak.enabled .Values.workloads.generic.enabled .Values.workloads.lake.enabled) }}
{{- fail "Il controllo di accesso richiede Ingress, Keycloak, Wise.Generic e Wise.Lake." }}
{{- end }}
{{- if eq $ing.keycloakHost $ing.apiHost }}
{{- fail "Keycloak e le API richiedono nomi host distinti." }}
{{- end }}
{{- $realm := required "Impostare gateway.realm." $gateway.realm }}
{{- $issuer := printf "https://%s/realms/%s" $ing.keycloakHost $realm }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: api
          address:
            socket_address: {address: 0.0.0.0, port_value: 8080}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: api
                    normalize_path: true
                    merge_slashes: true
                    path_with_escaped_slashes_action: REJECT_REQUEST
                    route_config:
                      name: middleware
                      virtual_hosts:
                        - name: api
                          domains: ["*"]
                          routes:
                            - match: {prefix: /generic/}
                              route: {cluster: generic, timeout: 120s}
                            - match: {prefix: /g/}
                              route: {cluster: generic, timeout: 120s}
                            - match:
                                prefix: /api/info/
                                headers: [{name: ":method", exact_match: GET}]
                              route: {cluster: lake}
                            - match:
                                prefix: /api/search/
                                headers: [{name: ":method", exact_match: GET}]
                              route: {cluster: lake}
                            - match:
                                prefix: /api/data/
                                headers: [{name: ":method", exact_match: GET}]
                              route: {cluster: lake}
                            - match: {prefix: /}
                              direct_response: {status: 404}
                    http_filters:
                      - name: envoy.filters.http.jwt_authn
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                          providers:
                            keycloak:
                              issuer: {{ $issuer | quote }}
                              audiences: [{{ required "Impostare gateway.audience." $gateway.audience | quote }}]
                              require_expiration: true
                              from_headers: [{name: Authorization, value_prefix: "Bearer "}]
                              forward: true
                              remote_jwks:
                                http_uri:
                                  uri: {{ printf "http://keycloak:%v/realms/%s/protocol/openid-connect/certs" .Values.workloads.keycloak.port $realm | quote }}
                                  cluster: keycloak
                                  timeout: 5s
                          rules:
                            - match: {prefix: /}
                              requires: {provider_name: keycloak}
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        {{- range $name := list "keycloak" "generic" "lake" }}
        - name: {{ $name }}
          type: STRICT_DNS
          connect_timeout: 5s
          load_assignment:
            cluster_name: {{ $name }}
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ $name }}
                          port_value: {{ (index $.Values.workloads $name).port }}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: api-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api-gateway}
      annotations:
        checksum/config: {{ printf "%s:%s:%s:%v:%v:%v" $issuer $gateway.audience .Chart.Version .Values.workloads.keycloak.port .Values.workloads.generic.port .Values.workloads.lake.port | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: envoy
          image: {{ required "Impostare gateway.image." $gateway.image | quote }}
          args: [-c, /etc/envoy-config/envoy.yaml]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/envoy-config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: api-gateway}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: {app.kubernetes.io/name: api-gateway}
  ports:
    - {port: 8080, targetPort: http}
{{- end }}
{{- if $ing.enabled }}
{{- if not .Values.workloads.keycloak.enabled }}
{{- fail "L'Ingress richiede Keycloak." }}
{{- end }}
{{- $loginHost := required "Impostare ingress.keycloakHost." $ing.keycloakHost }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-middleware
spec:
  ingressClassName: {{ required "Impostare ingress.className." $ing.className | quote }}
  tls:
    - hosts: [{{ $loginHost | quote }}]
      secretName: {{ required "Impostare ingress.tlsSecret." $ing.tlsSecret | quote }}
    {{- if $gateway.enabled }}
    - hosts: [{{ required "Impostare ingress.apiHost." $ing.apiHost | quote }}]
      secretName: {{ required "Impostare ingress.apiTlsSecret." $ing.apiTlsSecret | quote }}
    {{- end }}
  rules:
    - host: {{ $loginHost | quote }}
      http:
        paths:
          - path: /realms/{{ required "Impostare gateway.realm per la pubblicazione di Keycloak." $gateway.realm }}
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port: {number: {{ .Values.workloads.keycloak.port }}}
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port: {number: {{ .Values.workloads.keycloak.port }}}
    {{- if $gateway.enabled }}
    - host: {{ $ing.apiHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: {number: 8080}
    {{- end }}
{{- end }}
